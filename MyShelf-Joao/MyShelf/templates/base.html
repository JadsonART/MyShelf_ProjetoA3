<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Meu Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
    }
    .sidebar {
      width: 220px;
      height: 100vh;
      background: #f8f6f3;
      color: #7c5c3e;
      padding: 28px 18px 18px 18px;
      position: fixed;
      border-right: 1.5px solid #e7dfd7;
      font-family: 'Segoe UI',sans-serif;
      box-shadow: 2px 0 12px rgba(124,92,62,0.04);
    }
    .sidebar h4 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #7c5c3e;
      margin-bottom: 28px;
      letter-spacing: 1px;
    }
    .sidebar-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 2px solid #e7dfd7;
    }
    .sidebar-logo svg {
      max-width: 160px;
      height: auto;
      transition: transform 0.3s ease;
    }
    .sidebar-logo svg:hover {
      transform: scale(1.05);
    }
    .sidebar a {
      color: #7c5c3e;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0 10px 8px;
      font-size: 1.08rem;
      font-weight: 500;
      border-radius: 8px;
      transition: background 0.18s, color 0.18s;
      font-family: 'Segoe UI',sans-serif;
    }
    .sidebar a:hover {
      background: #e7dfd7;
      color: #a88a6d;
      box-shadow: 0 2px 8px rgba(124,92,62,0.07);
    }
    .content {
      margin-left: 220px;
      padding: 32px 24px;
      flex-grow: 1;
      background: #f8f6f3;
      min-height: 100vh;
      font-family: 'Segoe UI',sans-serif;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <img src="{{ url_for('static', filename='MYbook.png') }}" alt="MyShelf Logo" style="max-width: 140px; height: auto;">
    </div>
    
    <a href="{{ url_for('dashboard') }}">📊 Dashboard</a>
    <a href="{{ url_for('biblioteca') }}">📖 Minha Biblioteca</a>
    <a href="{{ url_for('recomendacoes') }}">💡 Recomendações</a>
    <a href="{{ url_for('buscar') }}">🔍 Buscar Livros</a>
    <a href="{{ url_for('catalogo') }}">📚 Catálogo</a>
    <a href="{{ url_for('desejos') }}">❤️ Meus Desejos</a>
    <a href="{{ url_for('perfil') }}">👤 Perfil</a>
    <a href="{{ url_for('logout') }}">🚪 Sair</a>
  </div>

  <!-- Conteúdo principal -->
  <div class="content">
    {% block content %}
    {% endblock %}
  </div>
</body>
</html>
