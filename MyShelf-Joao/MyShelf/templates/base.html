<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Meu Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
    }
    .sidebar {
      width: 220px;
      height: 100vh;
      background-color: #343a40;
      color: white;
      padding: 20px;
      position: fixed;
    }
    .sidebar a {
      color: white;
      text-decoration: none;
      display: block;
      padding: 10px 0;
    }
    .sidebar a:hover {
      background-color: #495057;
      border-radius: 5px;
    }
    .content {
      margin-left: 220px;
      padding: 20px;
      flex-grow: 1;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h4>📚 MyShelf</h4>
    <a href="{{ url_for('dashboard') }}">📊 Dashboard</a>
    <a href="{{ url_for('biblioteca') }}">📖 Minha Biblioteca</a>
    <a href="{{ url_for('recomendacoes') }}">💡 Recomendações</a>
    <a href="{{ url_for('buscar') }}">🔍 Buscar Livros</a>
    <a href="{{ url_for('catalogo') }}">📚 Catálogo</a>
    <a href="{{ url_for('desejos') }}">❤️ Meus Desejos</a>
    <a href="{{ url_for('perfil') }}">👤 Perfil</a>
    <a href="{{ url_for('logout') }}">🚪 Sair</a>
  </div>

  <!-- Conteúdo principal -->
  <div class="content">
    {% block content %}
    {% endblock %}
  </div>
</body>
</html>
