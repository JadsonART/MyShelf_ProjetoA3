{% extends "base_sem_aba_lateral.html" %}
{% block content %}
<h2>Registrar</h2>
<form method="POST">
  <input type="text" name="nome" placeholder="Nome" class="form-control mb-2" required>
  <input type="email" name="email" placeholder="Email" class="form-control mb-2" required>
  <input type="password" name="senha" placeholder="Senha" class="form-control mb-2" required>
  <button type="submit" class="btn btn-success">Registrar</button>
  <a href="{{ url_for('login') }}" class="btn btn-link">Voltar para Login</a>
</form>
{% if erro %}
<div class="alert alert-danger mt-2">{{ erro }}</div>
{% endif %}
{% endblock %}
