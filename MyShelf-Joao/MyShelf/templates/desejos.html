{% extends "base.html" %}
{% block content %}
<h2>Minha Lista de Desejos</h2>
<ul class="list-group">
  {% for titulo, autor, genero, id in livros %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      {{ titulo }} - {{ autor }} ({{ genero }})
      <form method="POST" action="{{ url_for('remover_desejo') }}">
        <input type="hidden" name="livro_id" value="{{ id }}">
        <button type="submit" class="btn btn-sm btn-danger">Remover</button>
      </form>
    </li>
  {% endfor %}
</ul>
<a href="{{ url_for('dashboard') }}" class="btn btn-info mt-3">Ir para o menu principal</a>
<a href="{{ url_for('catalogo') }}" class="btn btn-secondary mt-3">Ver catálogo</a>
<a href="{{ url_for('biblioteca') }}" class="btn btn-primary mt-3">Ver minha biblioteca</a>
<a href="{{ url_for('logout') }}" class="btn btn-danger mt-3">Sair</a>

{% endblock %}
