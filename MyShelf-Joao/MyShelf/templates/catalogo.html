{% extends "base.html" %}
{% block content %}
<h2>Catálogo de Livros</h2>
<ul class="list-group">
  {% for id, titulo, autor, genero in livros %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <div>
        <strong>{{ titulo }}</strong> - {{ autor }} ({{ genero }})
      </div>
      <div>
        <!-- Botão para adicionar à biblioteca -->
        <form method="POST" action="{{ url_for('adicionar_livro') }}" style="display:inline;">
          <input type="hidden" name="livro_id" value="{{ id }}">
          <button type="submit" class="btn btn-sm btn-success">Biblioteca</button>
        </form>

        <!-- Botão para adicionar à lista de desejos -->
        <form method="POST" action="{{ url_for('desejos') }}" style="display:inline;">
          <input type="hidden" name="livro_id" value="{{ id }}">
          <button type="submit" class="btn btn-sm btn-warning">Desejos</button>
        </form>
      </div>
    </li>
  {% endfor %}
</ul>

<a href="{{ url_for('dashboard') }}" class="btn btn-info mt-3">Ir para o menu principal</a>
<a href="{{ url_for('biblioteca') }}" class="btn btn-primary mt-3">Ver minha biblioteca</a>
<a href="{{ url_for('desejos') }}" class="btn btn-warning mt-3">Ver minha lista de desejos</a>
<a href="{{ url_for('logout') }}" class="btn btn-danger mt-3">Sair</a>

{% endblock %}
